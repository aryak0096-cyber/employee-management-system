spring.application.name=employee-management-system
server.port=8080

# Default database: file-based H2, so the app runs with zero setup and keeps data between restarts.
# Use the "mysql" profile for MySQL:  --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/ems
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT. Override the secret in any real deployment (at least 32 characters).
ems.jwt.secret=${EMS_JWT_SECRET:development-only-secret-change-me-please-0123456789}
ems.jwt.expiration-minutes=60

# Admin account created on first start when the database is empty.
ems.bootstrap.admin-username=admin
ems.bootstrap.admin-password=${EMS_ADMIN_PASSWORD:Admin@12345}

# Demo employees + sample attendance on first start (development convenience).
ems.seed-demo-data=true

# Do not leak internals in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
