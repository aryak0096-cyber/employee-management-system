# Activate with: --spring.profiles.active=mysql   (or SPRING_PROFILES_ACTIVE=mysql)
# Start a local MySQL with:  docker compose up -d
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ems}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:ems}
spring.datasource.password=${DB_PASSWORD:ems_password}
spring.jpa.hibernate.ddl-auto=update

# Never seed demo users into a real database.
ems.seed-demo-data=false
